# Local supporting services for development, tests and CI (BR8.3, AC1.2.1, AC1.2.3).
# The apps themselves run as normal processes (infrastructure answer Q1): the API, the web app
# and the background worker (`uv run python -m app.worker`, U6; scripts/dev.sh starts all three).
#
#   docker compose up -d --wait postgres mailpit
#
# Credentials default to local-only, non-secret values so CI needs no .env file.
# Override them with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB if you like.
# Every port is bound to 127.0.0.1 only. Images are pinned by digest; Dependabot
# does not track Compose digests, so bump them deliberately.

name: facial-analysis

services:
  postgres:
    # postgres:16 (16.15)
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    # axllent/mailpit v1.31.3 — local email catcher (development and CI only)
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
