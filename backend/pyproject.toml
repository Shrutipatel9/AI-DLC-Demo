[project]
name = "facial-analysis-api"
version = "0.1.0"
description = "Backend API for the AI Facial Analysis Platform (FastAPI + SQLAlchemy + PostgreSQL)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "anyio>=4.6",
    "mediapipe>=0.10.14",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.20",
    "stripe>=12",
    "httpx>=0.28",
    "numpy>=1.26",
    "fpdf2>=2.8.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "aiosmtpd>=1.4",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pypdf>=6.19.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff: lint + format (team Code Style). `S` = flake8-bandit security rules,
# `D` = docstrings (NFR7.3). `S101` (assert) is allowed only under tests/.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "D", "N", "C4", "SIM", "RUF", "PT", "ASYNC"]
ignore = [
    "D105", # magic methods document themselves
    "D107", # __init__ is documented on the class
    "RUF001", # the masked-email bullet character is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "D", "PT011"]
"alembic/**" = ["D"]

# ---------------------------------------------------------------------------
# mypy (strict on app/)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "aiosmtpd.*", "mediapipe.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest. Sockets are blocked except localhost (NFR8.2, BR8.7).
# Integration tests use the real PostgreSQL test database `app_test`.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --disable-socket --allow-hosts=127.0.0.1,localhost,::1"
markers = [
    "perf: latency and timing checks (U1 NFR9.1-NFR9.3, U2 NFR9.1-NFR9.5 and the anti-enumeration timing test); excluded from the coverage run",
    "eval: opt-in checks against the REAL model (U9 AC10.1.7, AC10.2.2); skipped unless RUN_CHAT_EVAL=1",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# import-linter: backend layering (BR8.8, AC1.3.5, NFR7.2)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Route handlers never import the JWT/OTP services or repositories directly"
type = "forbidden"
source_modules = ["app.identity.routes", "app.identity.dependencies", "app.health.routes"]
forbidden_modules = [
    "app.identity.tokens",
    "app.identity.codes",
    "app.identity.shadow",
    "app.identity.repositories",
    "app.identity.models",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Identity layers: routes -> services -> repositories"
type = "layers"
layers = [
    "app.identity.routes",
    "app.identity.dependencies",
    "app.identity.services | app.identity.cleanup",
    "app.identity.password_reset | app.identity.password_change",
    "app.identity.sessions | app.identity.shadow | app.identity.delivery",
    "app.identity.codes | app.identity.tokens | app.identity.passwords | app.identity.cookies",
    "app.identity.repositories",
    "app.identity.models",
]

