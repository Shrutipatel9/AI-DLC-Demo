<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #2A2D31; line-height: 1.5;">
    <p>Hello{% if full_name %} {{ full_name }}{% endif %},</p>
    <p>Your code to reset your password is:</p>
    <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #1A2230;">{{ code }}</p>
    <p>It is valid for {{ expires_minutes }} minutes and can be used once.</p>
    <p style="color: #5F6673;">Didn't ask for this? You can ignore this email; your password stays the same.</p>
  </body>
</html>
